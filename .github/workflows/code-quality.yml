name: Code Quality

on:
  push:
    branches: [ main, develop, research ]
  pull_request:
    branches: [ main, develop ]

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Cache pip packages
      uses: actions/cache@v3
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-lint-${{ hashFiles('**/requirements-dev.txt') }}

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pylint flake8 black isort mypy

    - name: Run Flake8
      run: |
        flake8 src/ --count --select=E9,F63,F7,F82 --show-source --statistics
        flake8 src/ --count --exit-zero --max-complexity=10 --max-line-length=120 --statistics

    - name: Run Pylint
      run: |
        pylint src/ --exit-zero --max-line-length=120

    - name: Check formatting with Black
      run: |
        black --check --line-length 120 src/

    - name: Check import order with isort
      run: |
        isort --check-only --profile black src/

    - name: Type check with mypy
      run: |
        mypy src/ --ignore-missing-imports --no-strict-optional --allow-untyped-calls
      continue-on-error: true
