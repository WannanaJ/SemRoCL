exp_name: moco_pretrain_stage1_LIGHT
output_dir: outputs

dataset:
  root_dir: "data/stage1_unpaired"
  datasets: ["LIME", "MEF", "DICM", "ExDark", "VV"]
  img_size: 256
  mode: unpaired
  sample_weights:
    LIME: 1.3
    MEF: 1.1
    DICM: 1.0
    ExDark: 1.4
    VV: 1.0
    default: 1.0

model:
  base_encoder: resnet18
  feat_dim: 128
  queue_size: 32768
  momentum: 0.999
  temperature: 0.07

mid_level_contrast:
  enabled: true
  layers: ["layer2", "layer3"]
  weight: 0.07
  temperature: 0.12

training:
  seed: 1024
  epochs: 80
  batch_size: 32
  lr: 0.03
  weight_decay: 0.0001
  num_workers: 4
  save_freq: 10
  warmup_epochs: 8
  warmup_lr: 0.003
  accumulate_steps: 1

illumination:
  enabled: true
  root_dir: "data/stage2_paired"
  datasets: ["LOL-v1"]
  batch_size: 8
  weight: 0.2

augmentation:
  enable_gamma: true
  gamma_range: [0.6, 1.5]
  exposure_range: [-0.15, 0.15]
  illumination_jitter: true
  noise_injection: true
  color_jitter: true

monitoring:
  metrics_interval: 200
  log_grad_norm: false
  log_queue_stats: false
  log_memory: false
  linear_probe:
    enabled: true
    dataset: "data/stage3_eval/ExDark/ExDark"
    batch_size: 96
    frequency: 30
    max_samples: 1500

dynamic_temperature:
  enabled: true
  min: 0.05
  max: 0.18
  momentum: 0.95
