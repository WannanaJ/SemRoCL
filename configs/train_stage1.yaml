exp_name: moco_pretrain_stage1
output_dir: outputs

dataset:
  root_dir: "D:/projects/SemRoCL/data/stage1_unpaired"
  datasets: ["LIME", "MEF", "DICM", "NPE", "VV", "ExDark", "SICE"]
  img_size: 320
  mode: unpaired
  sample_weights:
    LIME: 1.5
    MEF: 1.2
    DICM: 1.0
    NPE: 1.3
    VV: 1.0
    ExDark: 1.4
    SICE: 1.1
    default: 1.0

model:
  base_encoder: resnet50
  feat_dim: 128
  queue_size: 65536
  momentum: 0.999
  temperature: 0.07

mid_level_contrast:
  enabled: true
  layers: ["layer2", "layer3"]
  weight: 0.1
  temperature: 0.12

training:
  seed: 1024
  epochs: 120
  batch_size: 16
  lr: 0.03
  weight_decay: 0.0001
  num_workers: 4
  save_freq: 10
  warmup_epochs: 10
  warmup_lr: 0.003
  accumulate_steps: 1
  max_steps_per_epoch: 0

illumination:
  enabled: true
  root_dir: "D:/projects/SemRoCL/data/stage2_paired"
  datasets: ["LOL-v1"]
  batch_size: 8
  weight: 0.25
  frequency: 8

augmentation:
  enable_gamma: true
  gamma_range: [0.5, 1.7]
  exposure_range: [-0.2, 0.2]
  illumination_jitter: true
  noise_injection: true
  color_jitter: true

monitoring:
  metrics_interval: 300
  log_grad_norm: false
  log_queue_stats: false
  log_memory: false
  linear_probe:
    enabled: false
    dataset: "data/stage3_eval/ExDark/ExDark"
    batch_size: 128
    frequency: 20
    max_samples: 2000

dynamic_temperature:
  enabled: true
  min: 0.04
  max: 0.2
  momentum: 0.95
