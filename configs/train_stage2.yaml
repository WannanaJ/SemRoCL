# Stage 2: Enhancement Training Configuration - FIXED
# 
# FIXES:
# 1. Fixed warmup indentation (now under training)
# 2. All optimized loss weights preserved
# 3. Compatible with train_stage2_enhance.py

exp_name: semantic_enhancement_stage2_optimized
output_dir: outputs

dataset:
  root_dir: 'D:/projects/SemRoCL/data/stage2_paired'
  datasets: ["LOL-v1", "LOL-v2", "Real-LOLBLue", "FiveK", "LSRW"]
  img_size: 384
  mode: paired

model:
  base_encoder: resnet50
  pretrained_encoder: outputs/moco_pretrain_stage1/checkpoints/moco_pretrain_final.pth
  semantic_backbone: segformer-b0
  num_classes: 19
  enhancer_channels: 32
  num_iterations: 8

training:
  epochs: 200
  batch_size: 8
  
  # Base learning rate (for backward compatibility)
  lr: 0.0001
  
  # Individual learning rates (optimized)
  lr_generator: 0.0001
  lr_semantic: 0.00001
  lr_discriminator: 0.00001
  
  # Curriculum warmup parameters (FIXED: now under training)
  no_gan_epochs: 5
  freeze_semantic_epochs: 5
  adv_weight_warmup: 0.2
  semantic_weight_warmup: 0.3
  
  # Training control
  num_workers: 12
  save_freq: 5
  pin_memory: True
  prefetch_factor: 4
  persistent_workers: True
  accumulate_steps: 4
  
  # Discriminator control
  disc_update_freq: 3
  disc_update_threshold: 0.1
  
  # Learning rate schedule
  warmup_epochs: 15
  lr_decay_rate: 0.97
  
  # Regularization
  gradient_clip: 1.0
  use_ema: true
  ema_decay: 0.999
  
  # Label smoothing
  label_smoothing: true
  real_label: 0.9
  fake_label: 0.1

loss:
  # CRITICAL REBALANCING (from optimization analysis)
  w_color: 0.0001           # 270 × 0.0001 = 0.027 (was 0.001)
  w_semantic: 1.0           # 0.15 × 1.0 = 0.15 (was 0.01)
  w_adv: 0.5                # 0.5 × 0.5 = 0.25 (was 0.1)
  w_freq: 0.00001           # Keep safe
  w_task: 0.5               # Keep same
  w_perceptual: 2.0         # 0.9 × 2.0 = 1.8 (was 1.0)
  
  # Color loss components
  color_loss:
    weight_exp: 10
    weight_color: 5
    weight_tv: 1600

# Monitoring
monitoring:
  print_freq: 50
  visualize_freq: 500
  save_images_freq: 1000
  check_nan: true