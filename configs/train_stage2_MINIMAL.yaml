# Stage 2: Curriculum-Based Enhancement Training - FIXED & OPTIMIZED
#
# 修复要点：
# 1. 6个阶段渐进式学习（原来4个阶段过于激进）
# 2. 更现实的Phase目标（基于实际训练表现）
# 3. 放宽安全阈值，添加过渡期缓冲
# 4. 语义损失超温和引入：0 → 0.05 → 0.1 → 0.3 → 0.5 → 1.0
# 5. 单一损失变化原则（每个阶段只主要改变一个损失）

exp_name: semantic_enhancement_stage2_curriculum_v2
output_dir: outputs

dataset:
  root_dir: 'D:/projects/SemRoCL/data/stage2_paired'
  datasets: ["LOL-v1", "LOL-v2", "Real-LOLBLue", "FiveK", "LSRW"]
  img_size: 384
  mode: paired

model:
  base_encoder: resnet50
  pretrained_encoder: outputs/moco_pretrain_stage1/checkpoints/moco_pretrain_final.pth
  semantic_backbone: segformer-b0
  num_classes: 19
  enhancer_channels: 32
  num_iterations: 8

training:
  epochs: 200
  batch_size: 8
  
  # Learning rates
  lr: 0.0001
  lr_generator: 0.0001
  lr_semantic: 0.00005
  lr_discriminator: 0.000005
  
  # Training control
  num_workers: 12
  save_freq: 5
  pin_memory: true
  prefetch_factor: 4
  persistent_workers: true
  accumulate_steps: 2
  
  # Discriminator control
  disc_update_freq: 4
  disc_update_threshold: 0.05
  disc_start_epoch: 81    # 延后到Phase 5
  
  # Learning rate schedule
  warmup_epochs: 15       # 延长warmup
  lr_decay_rate: 0.98
  
  # Regularization
  gradient_clip: 1.0
  use_ema: true
  ema_decay: 0.999
  
  # Label smoothing for GAN
  label_smoothing: true
  real_label: 0.9
  fake_label: 0.1

# ==============================================================================
# 课程学习配置 - 6阶段渐进式
# ==============================================================================
curriculum:
  enabled: true
  
  # ============================================================================
  # Phase 1: 曝光稳定 (Epochs 1-15) - 延长至15个epoch
  # ============================================================================
  phase1:
    epochs: [1, 15]
    description: "Exposure stabilization - focus on basic brightness"
    loss_weights:
      w_color: 0.00001
      w_semantic: 0.0       # 完全禁用
      w_adv: 0.0
      w_freq: 0.0
      w_task: 0.3
      w_perceptual: 0.05    # 降低到0.05（原来0.1）
    monitoring:
      target_psnr: 11.0     # 现实目标（原来13.0）
      target_ssim: 0.25     # 现实目标（原来0.30）
      max_color_loss: 200   # 放宽（原来150）
      
  # ============================================================================
  # Phase 2: 微量语义约束 (Epochs 16-30) - 超温和引入
  # ============================================================================
  phase2:
    epochs: [16, 30]
    description: "Gentle semantic introduction - minimal constraint"
    loss_weights:
      w_color: 0.00001
      w_semantic: [0.0, 0.05]  # 超温和：0 → 0.05（原来0 → 0.5）
      w_adv: 0.0
      w_freq: 0.0
      w_task: 0.3              # 保持不变
      w_perceptual: 0.05       # 保持不变
    monitoring:
      target_psnr: 12.5        # 渐进目标
      target_ssim: 0.30
      max_semantic_loss: 0.35  # 宽松（原来0.20）
      
  # ============================================================================
  # Phase 3: 轻度语义约束 (Epochs 31-50)
  # ============================================================================
  phase3:
    epochs: [31, 50]
    description: "Light semantic constraint - gradual increase"
    loss_weights:
      w_color: 0.00001
      w_semantic: [0.05, 0.15]  # 渐进：0.05 → 0.15
      w_adv: 0.0
      w_freq: 0.0
      w_task: 0.3
      w_perceptual: 0.05        # 仍然保持低
    monitoring:
      target_psnr: 14.0
      target_ssim: 0.38
      max_semantic_loss: 0.30
      
  # ============================================================================
  # Phase 4: 中度语义+感知 (Epochs 51-80)
  # ============================================================================
  phase4:
    epochs: [51, 80]
    description: "Moderate semantic + perceptual refinement"
    loss_weights:
      w_color: 0.00001
      w_semantic: [0.15, 0.35]   # 继续渐进：0.15 → 0.35
      w_adv: 0.0
      w_freq: 0.00001            # 启用频率损失
      w_task: [0.3, 0.4]         # 轻微增加
      w_perceptual: [0.05, 0.3]  # 开始增加感知损失
    monitoring:
      target_psnr: 16.0
      target_ssim: 0.48
      max_lpips: 0.60
      
  # ============================================================================
  # Phase 5: 强语义+对抗引入 (Epochs 81-120)
  # ============================================================================
  phase5:
    epochs: [81, 120]
    description: "Strong semantic + adversarial introduction"
    loss_weights:
      w_color: 0.00001
      w_semantic: [0.35, 0.6]    # 0.35 → 0.6
      w_adv: [0.0, 0.08]         # 超温和GAN引入：0 → 0.08
      w_freq: 0.00001
      w_task: [0.4, 0.5]
      w_perceptual: [0.3, 0.8]   # 继续增加
    monitoring:
      target_psnr: 18.0
      target_ssim: 0.56
      max_lpips: 0.50
      d_loss_range: [0.15, 0.85]  # 宽松范围
      
  # ============================================================================
  # Phase 6: 最终打磨 (Epochs 121-200)
  # ============================================================================
  phase6:
    epochs: [121, 200]
    description: "Final polish - full weights"
    loss_weights:
      w_color: 0.00001
      w_semantic: [0.6, 1.0]     # 达到最终权重
      w_adv: [0.08, 0.15]        # 温和GAN（降低到0.15，原来0.3）
      w_freq: 0.00001
      w_task: 0.5
      w_perceptual: [0.8, 1.2]   # 达到最终权重（降低到1.2，原来1.5）
    monitoring:
      target_psnr: 19.5
      target_ssim: 0.62
      max_lpips: 0.40
      d_loss_range: [0.25, 0.75]

# ==============================================================================
# 基础损失配置
# ==============================================================================
loss:
  # 最终目标权重（Phase 6结束时）
  w_color: 0.00001
  w_semantic: 1.0
  w_adv: 0.15        # 降低（原来0.3）
  w_freq: 0.00001
  w_task: 0.5
  w_perceptual: 1.2  # 降低（原来1.5）
  
  color_loss:
    weight_exp: 10
    weight_color: 5
    weight_tv: 1600

# ==============================================================================
# 监控和安全 - 改进版
# ==============================================================================
monitoring:
  print_freq: 50
  visualize_freq: 500
  save_images_freq: 1000
  check_nan: true
  
  phase_transition_check: true
  rollback_on_failure: false  # 禁用回滚，允许继续训练
  
  # 安全阈值 - 大幅放宽
  safety:
    max_psnr_drop: 5.0           # 放宽到5.0 dB（原来2.0）
    max_d_loss_low_epochs: 15    # 更宽容（原来5）
    max_lpips_increase: 0.25     # 放宽（原来0.1）
    nan_check_freq: 10
    
    # 过渡期缓冲
    transition_grace_epochs: 5   # phase切换后5个epoch内不严格检查
    enable_grace_period: true    # 启用缓冲期
    
    # 只在严重情况下停止
    stop_on_nan: true
    stop_on_divergence: false    # 不因为指标波动停止

# ==============================================================================
# 预期收敛行为 - 更新版
# ==============================================================================
# Phase 1 (1-15): PSNR 8→11, SSIM 0.15→0.25 - 稳定曝光
# Phase 2 (16-30): PSNR 11→12.5, SSIM 0.25→0.30 - 微量语义
# Phase 3 (31-50): PSNR 12.5→14, SSIM 0.30→0.38 - 轻度语义
# Phase 4 (51-80): PSNR 14→16, SSIM 0.38→0.48 - 中度语义+感知
# Phase 5 (81-120): PSNR 16→18, SSIM 0.48→0.56 - 强语义+GAN引入
# Phase 6 (121-200): PSNR 18→20+, SSIM 0.56→0.65+ - 最终打磨