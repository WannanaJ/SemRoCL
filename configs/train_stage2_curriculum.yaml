# Stage 2: Optimized Curriculum-Based Enhancement Training
#
# Optimizations:
# 1. More gradual semantic loss ramp
# 2. Better coordinated learning rate with curriculum phases
# 3. Improved gradient clipping and regularization
# 4. Refined phase transitions

exp_name: semantic_enhancement_stage2_optimized
output_dir: outputs

dataset:
  root_dir: 'D:/projects/SemRoCL/data/stage2_paired'
  datasets: ["LOL-v1", "LOL-v2", "Real-LOLBlue", "FiveK", "LSRW"]
  img_size: 384
  mode: paired

model:
  base_encoder: resnet50
  pretrained_encoder: outputs/moco_pretrain_stage1/checkpoints/moco_pretrain_final.pth
  enhancer_channels: 32
  num_iterations: 8
  semantic_channels: 64
  use_semantic: true

training:
  epochs: 200
  batch_size: 4
  
  # Learning rates - optimized for stability
  lr: 0.0001
  lr_generator: 0.0001
  lr_semantic: 0.00005
  lr_discriminator: 0.000005
  
  # Training control
  num_workers: 0
  save_freq: 5
  pin_memory: true
  prefetch_factor: 2
  persistent_workers: false
  accumulate_steps: 4
  
  # Discriminator control
  disc_update_freq: 5
  disc_update_threshold: 0.05
  disc_start_epoch: 90  # Start earlier but with smaller weight
  
  # Learning rate schedule
  warmup_epochs: 15
  use_cosine_schedule: true
  
  # Regularization
  gradient_clip: 1.0  # Increased from 0.5 for better learning
  gradient_clip_semantic: 0.5
  use_ema: true
  ema_decay: 0.999
  
  # Label smoothing for GAN
  label_smoothing: true
  real_label: 0.9
  fake_label: 0.1

# Optimized Curriculum Learning Configuration
curriculum:
  enabled: true
  
  # Phase 1: Foundation (Epochs 1-15)
  phase1:
    epochs: [1, 15]
    description: "Foundation - color and exposure stabilization"
    loss_weights:
      w_color: 0.001
      w_semantic: 0.0
      w_adv: 0.0
      w_freq: 0.0
      w_task: 0.0
      w_perceptual: 0.01
    monitoring:
      target_psnr: 11.0
      target_ssim: 0.25
      
  # Phase 2: Gentle semantic intro (Epochs 16-35)
  phase2:
    epochs: [16, 35]
    description: "Gentle semantic introduction"
    loss_weights:
      w_color: 0.001
      w_semantic: [0.0, 0.05]  # Very gradual
      w_adv: 0.0
      w_freq: 0.0
      w_task: 0.0
      w_perceptual: [0.01, 0.05]
    monitoring:
      target_psnr: 12.5
      target_ssim: 0.30
      
  # Phase 3: Light semantic (Epochs 36-60)
  phase3:
    epochs: [36, 60]
    description: "Light semantic constraint"
    loss_weights:
      w_color: 0.0008
      w_semantic: [0.05, 0.15]  # Smoother transition
      w_adv: 0.0
      w_freq: 0.00001
      w_task: 0.0
      w_perceptual: [0.05, 0.15]
    monitoring:
      target_psnr: 14.0
      target_ssim: 0.38
      
  # Phase 4: Moderate semantic (Epochs 61-90)
  phase4:
    epochs: [61, 90]
    description: "Moderate semantic + perceptual"
    loss_weights:
      w_color: 0.0005
      w_semantic: [0.15, 0.30]
      w_adv: 0.0
      w_freq: 0.00001
      w_task: 0.0
      w_perceptual: [0.15, 0.40]
    monitoring:
      target_psnr: 16.0
      target_ssim: 0.48
      
  # Phase 5: Strong semantic + adversarial intro (Epochs 91-130)
  phase5:
    epochs: [91, 130]
    description: "Strong semantic + gentle adversarial"
    loss_weights:
      w_color: 0.0003
      w_semantic: [0.30, 0.50]
      w_adv: [0.0, 0.02]  # Gentle adversarial intro
      w_freq: 0.00001
      w_task: 0.0
      w_perceptual: [0.40, 0.70]
    monitoring:
      target_psnr: 17.5
      target_ssim: 0.55
      
  # Phase 6: Final polish (Epochs 131-200)
  phase6:
    epochs: [131, 200]
    description: "Final polish with full losses"
    loss_weights:
      w_color: 0.0002
      w_semantic: [0.50, 0.60]  # Reduced from 0.8
      w_adv: [0.02, 0.05]  # Reduced from 0.1
      w_freq: 0.00001
      w_task: 0.0
      w_perceptual: [0.70, 1.0]
    monitoring:
      target_psnr: 19.0
      target_ssim: 0.60

# Base Loss Configuration (Target weights)
loss:
  w_color: 0.0002
  w_semantic: 0.60  # Reduced from 0.8
  w_adv: 0.05  # Reduced from 0.1
  w_freq: 0.00001
  w_task: 0.0  # Disabled for simpler training
  w_perceptual: 1.0
  
  color_loss:
    weight_exp: 10
    weight_color: 5
    weight_tv: 200

# Monitoring and Safety
monitoring:
  print_freq: 50
  visualize_freq: 500
  save_images_freq: 1000
  check_nan: true
  
  phase_transition_check: true
  rollback_on_failure: false
  
  # Safety thresholds
  safety:
    max_psnr_drop: 3.0  # Stricter than before
    max_d_loss_low_epochs: 10  # Faster detection
    max_lpips_increase: 0.15  # Stricter
    nan_check_freq: 10
    
    # Transition grace period
    transition_grace_epochs: 5
    enable_grace_period: true
    
    # Loss explosion detection
    max_total_loss: 50.0
    loss_explosion_threshold: 10.0
    
    # Conservative stopping
    stop_on_nan: true
    stop_on_divergence: false

# Expected Convergence Behavior
# Phase 1 (1-15): PSNR 8->11, SSIM 0.15->0.25 - Stable foundation
# Phase 2 (16-35): PSNR 11->12.5, SSIM 0.25->0.30 - Gentle semantic
# Phase 3 (36-60): PSNR 12.5->14, SSIM 0.30->0.38 - Light semantic
# Phase 4 (61-90): PSNR 14->16, SSIM 0.38->0.48 - Moderate semantic
# Phase 5 (91-130): PSNR 16->17.5, SSIM 0.48->0.55 - Strong semantic
# Phase 6 (131-200): PSNR 17.5->19+, SSIM 0.55->0.60+ - Final polish