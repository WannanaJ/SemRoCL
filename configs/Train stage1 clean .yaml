exp_name: moco_pretrain_stage1
output_dir: outputs

dataset:
  root_dir: D:/projects/SemRoCL/data/LOL-v1
  img_size: 384
  mode: unpaired

model:
  base_encoder: resnet50
  feat_dim: 128
  queue_size: 65536
  momentum: 0.999
  temperature: 0.07

training:
  epochs: 200
  batch_size: 16
  lr: 0.03
  weight_decay: 0.0001
  num_workers: 4
  save_freq: 10

augmentation:
  illumination_jitter: true
  noise_injection: true
  color_jitter: true